federate soldier was nicknamed 'Johnny Reb' and wore a gray uniform.`,`Soldiers ate hard crackers called 'hardtack', marched long miles, and spent 90% of time in camp.`],graphic:{type:`comparison`,title:`Blue vs Gray Soldiers`,description:`Uniforms and nicknames of the infantrymen`,iconName:`Shirt`,visualData:[{label:`Billy Yank`,value:`Union Blue`,sublabel:`Wool sack coat, kepi cap, rifle`,color:`bg-blue-700`,icon:`🔵`},{label:`Johnny Reb`,value:`Confederate Gray`,sublabel:`Gray/butternut coat, slouch hat`,color:`bg-slate-500`,icon:`⚪`},{label:`Daily Ration`,value:`Hardtack & Coffee`,sublabel:`Rock-hard flour crackers & bacon`,color:`bg-amber-700`,icon:`🍞`}]},questionIds:[46,47,48]},{id:16,number:16,worldId:4,title:`Women & the War Effort`,titleEs:`Las Mujeres y el Esfuerzo Bélico`,emoji:`👩‍⚕️`,color:`from-rose-400 to-pink-600`,description:`Clara Barton and the heroines who cared for wounded soldiers and kept family farms running.`,keyPoints:[`Thousands of courageous women served as battlefield nurses treating sick and injured soldiers.`,`Clara Barton, the 'Angel of the Battlefield', went right to the front lines and later founded the American Red Cross.`,`At home, women sewed uniforms, rolled bandages, prepared supplies, and managed family farms and businesses.`],graphic:{type:`cards`,title:`Heroines on Frontline & Home`,description:`Dedication and bravery of Civil War women`,iconName:`HeartHandshake`,visualData:[{label:`Clara Barton`,value:`American Red Cross`,sublabel:`Founded Red Cross in 1881`,color:`bg-rose-500`,icon:`❤️`},{label:`Battlefield Nurses`,value:`Saved Lives`,sublabel:`Cleaned wounds, administered medicine`,color:`bg-pink-500`,icon:`🩹`},{label:`Home Front`,value:`Ran Farms & Shops`,sublabel:`Made uniforms, raised vital aid funds`,color:`bg-purple-500`,icon:`🏡`}]},questionIds:[49,50,51]},{id:17,number:17,worldId:5,title:`The Tide Turns: Gettysburg & Vicksburg`,titleEs:`Cambia la Marea: Gettysburg y Vicksburg`,emoji:`🏆`,color:`from-amber-500 to-yellow-600`,description:`July 1863: The 3-day clash at Gettysburg, Grant captures Vicksburg, and the Gettysburg Address.`,keyPoints:[`The Battle of Gettysburg (July 1-3, 1863) in Pennsylvania stopped Lee's invasion of the North forever.`,`On July 4, 1863, Grant captured Vicksburg, giving the Union complete control of the Mississippi River.`,`Lincoln's 2-minute 'Gettysburg Address' honored fallen soldiers and redefined the purpose of America.`],graphic:{type:`timeline`,title:`July 1863: The Dual Victories`,description:`The pivotal week that decided the war's outcome`,iconName:`Trophy`,visualData:[{label:`July 1-3, 1863`,value:`Gettysburg (East)`,sublabel:`Lee defeated in Pennsylvania`,color:`bg-amber-500`,icon:`⚔️`},{label:`July 4, 1863`,value:`Vicksburg (West)`,sublabel:`Union takes the Mississippi River`,color:`bg-blue-600`,icon:`🌊`},{label:`Nov 19, 1863`,value:`Gettysburg Address`,sublabel:`'Government of the people, by the people'`,color:`bg-indigo-600`,icon:`📜`}]},questionIds:[52,53,54]},{id:18,number:18,worldId:5,title:`Confederate Problems Mount`,titleEs:`Se Acumulan los Problemas Confederados`,emoji:`📉`,color:`from-stone-500 to-neutral-700`,description:`Starvation, blockade runners, worthless paper money, and soldiers deserting the army.`,keyPoints:[`By 1864, the Confederacy faced severe shortages of food, medicine, and uncontrollable inflation.`,`The Union naval blockade choked off southern seaports, preventing weapon and medicine imports.`,`'Deserting' meant leaving the army without permission to return home and save starving families.`],graphic:{type:`diagram`,title:`Collapse of Confederate Resources (1864)`,description:`Severe shortages and despair in the South`,iconName:`AlertTriangle`,visualData:[{label:`Naval Blockade`,value:`Ports Sealed Off`,sublabel:`No shoes, salt, or rifles entering`,color:`bg-blue-600`,icon:`⚓`},{label:`Hyperinflation`,value:`Flour $1,000/bbl`,sublabel:`Confederate dollars became worthless`,color:`bg-amber-600`,icon:`💸`},{label:`Desertion`,value:`1 in 3 Left Army`,sublabel:`Men rushed home to starving families`,color:`bg-rose-600`,icon:`🏃`}]},questionIds:[55,56,57]},{id:19,number:19,worldId:5,title:`The War Draws to a Close`,titleEs:`La Guerra Llega a su Fin`,emoji:`🏁`,color:`from-orange-600 to-red-700`,description:`Sherman's March to the Sea and Lee's historic surrender to Grant at Appomattox on April 9, 1865.`,keyPoints:[`General William T. Sherman led the famous 'March to the Sea' across Georgia, capturing Atlanta and Savannah.`,`Sherman waged 'total war', wrecking railroads, bridges, and war supplies to break the South's will.`,`On April 9, 1865, General Lee surrendered to General Grant at Appomattox Court House, Virginia.`],graphic:{type:`timeline`,title:`The Final March to Peace`,description:`From Georgia to Appomattox Court House`,iconName:`Flag`,visualData:[{label:`Late 1864`,value:`March to the Sea`,sublabel:`Sherman captured Atlanta & Savannah`,color:`bg-orange-600`,icon:`🔥`},{label:`April 9, 1865`,value:`Appomattox Surrender`,sublabel:`Lee signs terms with Grant`,color:`bg-emerald-600`,icon:`🤝`},{label:`Grant's Order`,value:`'Countrymen Again'`,sublabel:`Confederates kept horses to farm`,color:`bg-blue-600`,icon:`🕊️`}]},questionIds:[58,59,60]},{id:20,number:20,worldId:5,title:`The Death of President Lincoln`,titleEs:`La Muerte del Presidente Lincoln`,emoji:`🕯️`,color:`from-slate-700 to-black`,description:`Tragedy strikes America: Lincoln assassinated at Ford's Theatre on April 14, 1865 by John Wilkes Booth.`,keyPoints:[`On Good Friday, April 14, 1865—just 5 days after Lee surrendered—President Lincoln was assassinated.`,`Lincoln was shot while watching a play from the presidential box at Ford's Theatre in Washington, D.C.`,`The assassin was John Wilkes Booth, a Confederate sympathizer and well-known actor.`],graphic:{type:`cards`,title:`Tragedy at Ford's Theatre`,description:`A nation mourns its greatest wartime president`,iconName:`Feather`,visualData:[{label:`Date`,value:`April 14, 1   sheet.clear();

// 3. MENÚ SUPERIOR EN GOOGLE SHEETS
function onOpen() {
  try {
    var ui = SpreadsheetApp.getUi();
    ui.createMenu('🏆 Footprints Alumnos')
      .addItem('✨ Llenar / Actualizar Tabla', 'llenarHojaDirectamente')
      .addItem('📊 Reordenar Ranking por XP', 'reordenarPorXP')
      .addToUi();
  } catch (e) {}
}

// 4. REORDENAR RANKING POR PUNTOS XP
function reordenarPorXP() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Top_Students') || ss.getActiveSheet();
  var range = sheet.getDataRange();
  if (range.getNumRows() <= 2) return;
  
  var numRows = range.getNumRows() - 1;
  var dataRange = sheet.getRange(2, 1, numRows, range.getNumColumns());
  dataRange.sort({ column: 3, ascending: false });
  
  var ranks = [];
  for (var i = 1; i <= numRows; i++) {
    ranks.push([i]);
  }
  sheet.getRange(2, 1, numRows, 1).setValues(ranks);
}

// 5. RECIBE PUNTUACIONES DEL JUEGO EN VIVO (Webhook doPost)
function doPost(e) {
  try {
    var raw = (e.postData && e.postData.contents) ? e.postData.contents : '';
    var params = {};
    if (raw) {
      try {
        params = JSON.parse(raw);
      } catch (ex) {
        params = e.parameter || {};
      }
    } else if (e.parameter) {
      params = e.parameter;
    }

    var studentName = (params.studentName || '').trim();
    if (!studentName) {
      return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: 'Falta studentName' }))
        .setMimeType(ContentService.MimeType.JSON);
    }

    var xp = Number(params.xp) || 0;
    var confites = Number(params.confites) || 0;
    var streak = Number(params.streak) || 0;
    var unitsCompleted = Number(params.unitsCompleted) || 0;
    var avatar = params.avatar || 'owl-explorer';
    var lastUpdated = new Date().toISOString().split('T')[0];

    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sheet = ss.getSheetByName('Top_Students') || ss.getActiveSheet();

    // Si la hoja no tiene encabezados, agregarlos
    if (sheet.getLastRow() === 0) {
      sheet.appendRow(['Rango', 'Nombre del Estudiante', 'Puntos XP ⭐', 'Confites 🍬', 'Racha de Días 🔥', 'Unidades Completadas 📚', 'Avatar', 'Última Actualización']);
    }

    var data = sheet.getDataRange().getValues();
    var foundRow = -1;

    for (var i = 1; i < data.length; i++) {
      if (String(data[i][1]).trim().toLowerCase() === studentName.toLowerCase()) {
        foundRow = i + 1;
        xp = Math.max(xp, Number(data[i][2]) || 0);
        confites = Math.max(confites, Number(data[i][3]) || 0);
        streak = Math.max(streak, Number(data[i][4]) || 0);
        unitsCompleted = Math.max(unitsCompleted, Number(data[i][5]) || 0);
        break;
      }
    }

    if (foundRow > 0) {
      sheet.getRange(foundRow, 2, 1, 7).setValues([[studentName, xp, confites, streak, unitsCompleted, avatar, lastUpdated]]);
    } else {
      var newRank = Math.max(1, data.length);
      sheet.appendRow([newRank, studentName, xp, confites, streak, unitsCompleted, avatar, lastUpdated]);
    }

    reordenarPorXP();

    return ContentService.createTextOutput(JSON.stringify({ status: 'success', studentName: studentName, xp: xp }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

// 6. CONSULTA VÍA GET
function doGet() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Top_Students') || ss.getActiveSheet();
  var data = sheet.getDataRange().getValues();
  var result = [];

  for (var i = 1; i < data.length; i++) {
    if (data[i][1]) {
      result.push({
        rank: data[i][0],
        studentName: data[i][1],
        xp: Number(data[i][2]) || 0,
        confites: Number(data[i][3]) || 0,
        streak: Number(data[i][4]) || 0,
        unitsCompleted: Number(data[i][5]) || 0,
        avatar: data[i][6] || 'owl-explorer',
        lastUpdated: data[i][7] ? String(data[i][7]) : ''
      });
    }
  }

  return ContentService.createTextOutput(JSON.stringify({
    status: 'success',
